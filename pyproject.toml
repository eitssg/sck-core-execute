[project]
name = "sck-core-execute"
version = "1.3.0"
description = "Core Automation Engine execute Lambda function"
authors = [{ name = "James Barwick", email = "jbarwick@eits.com.sg" }]
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["sck", "core", "aws", "cloud", "automation"]
requires-python = ">=3.11,<3.13"

dependencies = [
    "boto3 (>=1.34,<1.35)",
    "botocore (>=1.34,<1.35)",
    "inflect (>=7.5.0,<8.0)",
    "sck-core-framework",
    "sck-core-db",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.3.3,<9.0.0)",
    "flake8 (>=7.1.1,<8.0.0)",
    "cfn-lint (>1.22)",
    "pytest-asyncio (>=0.25.0,<0.26.0)",
    "black (>=24.10.0,<25.0.0)",
    "boto3-stubs (>=1.34.51,<1.35.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
]


[tool.hatch.build.targets.wheel]
packages = ["core_execute"]

[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true

# Use a proper multi-line regex (mirrors style used in framework module)
exclude = '''
/(
        \.git
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
    | venv
    | \.venv
    | htmlcov
)/
'''

[tool.uv.sources]
sck-core-framework = { path = "../sck-core-framework", editable = true }
sck-core-db = { path = "../sck-core-db", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
